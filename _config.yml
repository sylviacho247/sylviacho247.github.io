# Jekyll configuration for sylviacho247.github.io
#
# The _news folder is registered as a "collection". Each file in it becomes
# an item in Recent News on the home page AND gets its own page at
# /news/<filename>/ — so a short item can stay one line, and a longer one
# can have a "Read more" link to the full post.
#
# Everything else on the site is plain HTML, copied through untouched.
# Note: no `theme:` key. The site uses its own style.css.

title: Sylvia Cho
description: Speech scientist and lecturer in Linguistics at the University of British Columbia.
url: https://sylviacho247.github.io

collections:
  news:
    output: true # each news item also gets its own page
    permalink: /news/:path/

defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: news

# How many news items to show on the home page.
news_limit: 3

exclude:
  - README.md
  - License.MD
  - workflows
